<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Save the Date – 23.07.2027</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">

    <!-- Sternenhimmel -->
    <div class="stars stars-small"></div>
    <div class="stars stars-medium"></div>
    <div class="stars stars-large"></div>

    <div class="content">

      <!-- Persönliche Begrüßung -->
      <p id="guestGreeting" class="guest-greeting"></p>

      <h1>Save the Date</h1>

      <p class="date">
        23.07.2027
      </p>

      <p class="place">
        Estonia
      </p>

      <div class="divider"></div>

      <p class="announcement">
        The countdown to forever has begun.
      </p>

      <div class="photo-wrapper">
        <img
          src="junic.jpg"
          alt="Us"
          class="couple-photo"
        >
      </div>

    </div>

  </main>


  <!-- Personalisierte Einladungen -->
  <script>

    const guests = {

      "A7K2MX": "Anna & Max",

      "B4P8QZ": "Lisa & Tom",

      "C9R3LW": "Family Müller"

    };


    const params =
      new URLSearchParams(
        window.location.search
      );


    const inviteCode =
      params.get("invite");


    const greeting =
      document.getElementById(
        "guestGreeting"
      );


    if (
      inviteCode &&
      guests[inviteCode]
    ) {

      greeting.textContent =
        `Welcome, ${guests[inviteCode]}`;

      greeting.classList.add(
        "visible"
      );

    }

  </script>

</body>
</html>
