<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Save the Date – 23.07.2027</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="hero">

    <!-- Sternenhimmel -->
    <div class="stars stars-small"></div>
    <div class="stars stars-medium"></div>
    <div class="stars stars-large"></div>

    <div class="content">

      <!-- Persönliche Begrüßung -->
      <p id="guestGreeting" class="guest-greeting"></p>

      <h1>Save the Date</h1>

      <p class="date">
        23.07.2027
      </p>

      <p class="place">
        Estonia
      </p>

      <div class="divider"></div>

      <p class="announcement">
        The countdown to forever has begun.
      </p>

      <div class="photo-wrapper">
        <img
          src="junic.jpg"
          alt="Us"
          class="couple-photo"
        >
      </div>

    </div>

  </main>


  <!-- Personalisierte Einladungen -->
  <script>

    const guests = {

      "J7N4CX": "Juna & Niclas",
      "B8D2KR": "Brigitte & Dieter",
      "Y3D9MP": "Yvonne & Dominik",
      "O6N1ZT": "Olga & Nikolai",
      "L5L8QV": "Lena & Leonid",
      "C2A7HF": "Celine & Angelo",
      "A9M3WX": "Andrina & Mio",
      "T4R6BK": "Theresa & Ralf",
      "J8F2NP": "Jessi & Flo",
      "D7L5SC": "DJ Los Palmas",
      "J3L9VR": "Johanna & Leo",
      "M6D4QX": "Milena & Diogo",
      "V2M8KF": "Verena & Manuel",
      "M9C5TZ": "Martin & Caro",
      "L4S7HP": "Laura & Super Sommelier",
      "N8I3BW": "Natalia & Igor"

    };


    const params =
      new URLSearchParams(
        window.location.search
      );


    const inviteCode =
      params.get("invite");


    const greeting =
      document.getElementById(
        "guestGreeting"
      );


    if (
      inviteCode &&
      guests[inviteCode]
    ) {

      greeting.textContent =
        `Welcome ${guests[inviteCode]}`;

      greeting.classList.add(
        "visible"
      );

    }

  </script>

</body>
</html>
